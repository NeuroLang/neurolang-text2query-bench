[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurolang-text2query-bench"
version = "0.1.0"
description = "A TEXT2SPARQL-style benchmark of natural language to NeuroLang query translation"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "neurolang-apps[llm]",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
t2q-bench = "text2query_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/text2query_bench"]

# NeuroLang is a uv workspace of four packages (nl_expr, nl_core,
# neurolang, neurolang_apps); the assistant is in neurolang_apps. Install
# a local checkout of them, editable, before the bench (see the README).

[tool.pytest.ini_options]
testpaths = ["tests"]
