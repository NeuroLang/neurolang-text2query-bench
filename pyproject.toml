[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neurolang-text2query-bench"
version = "0.1.0"
description = "A TEXT2SPARQL-style benchmark of natural language to NeuroLang query translation"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "neurolang[llm]",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
t2q-bench = "text2query_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/text2query_bench"]

# The LLM assistant is in the tui-5-llm branch of NeuroLang until it is
# merged; install a local checkout with
#   uv pip install -e "/path/to/NeuroLang[llm]"
[tool.uv.sources]
neurolang = { git = "https://github.com/NeuroLang/NeuroLang", branch = "tui-5-llm" }

[tool.pytest.ini_options]
testpaths = ["tests"]
