      n(c) :- AGGREGATE[](ch(u) @ count(u)) = c
      ans(c) :- n(c)
  18:
    datalog: ans(u, x) :- dbp:parentPeak(x, <http://dbpedia.org/resource/Denali>), dbp:location(x, y),
      dbo:country(y, u)
  19:
    datalog: ans(u) :- dbo:managerClub(<http://dbpedia.org/resource/Pep_Guardiola>, x), dbo:team(u, x),
      dbo:SoccerPlayer(u)
  20:
    datalog: ans(u) :- dbo:sourcePlace(x, <http://dbpedia.org/resource/Yellowstone_National_Park>), dbo:city(x,
      u), dbo:River(x)
  21:
    datalog: |-
      aa(u, a) :- dbo:Airline(a), dbp:alliance(a, u)
      cnt(u, n) :- AGGREGATE[u](aa(u, a) @ count(a)) = n
      top(m) :- AGGREGATE[](cnt(u, n) @ max(n)) = m
      ans(u) :- cnt(u, m), top(m)
    note: ORDER BY DESC(COUNT) OFFSET 0 LIMIT 1 is the count equal to the maximum (ties all kept).
  22:
