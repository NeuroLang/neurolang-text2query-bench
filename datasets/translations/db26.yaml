# Datalog translations of the gold SPARQL queries of TEXT2SPARQL db26
# (DBpedia 2015-10), by question id. Each is checked against the official
# result set by `t2q-bench --dataset datasets/db26.yaml check-gold`.
#
# Conventions: predicates are named by prefix (dbo:starring, dbp:title,
# yago:..); an instance of a class C is C(x) (types are materialised, no
# subclass reasoning); IRIs are <...>; ASK is ans() :- ...
translations:
  1:
    datalog: |-
      pres(u) :- dbo:President(u), dbo:country(u, <http://dbpedia.org/resource/France>)
      pres(u) :- dbo:Person(u), dbp:title(u, <http://dbpedia.org/resource/President_of_France>)
      ans(u) :- pres(u)
  2:
    datalog: |-
      decade(180)
      decade(181)
      decade(182)
      decade(183)
      decade(184)
      decade(185)
      decade(186)
      decade(187)
      decade(188)
      decade(189)
      decade(190)
      decade(191)
      decade(192)
      decade(193)
      decade(194)
      decade(195)
      decade(196)
      decade(197)
      decade(198)
      decade(199)
      decade(200)
      decade(201)
      decade(202)
      fd(a, x, f) :- dbo:Film(f), dbo:starring(f, a), dbo:releaseDate(f, d), decade(x), strstarts(str(d), str(x))
      cnt(a, x, n) :- AGGREGATE[a, x](fd(a, x, f) @ count(f)) = n
      top(m) :- AGGREGATE[](cnt(a, x, n) @ max(n)) = m
      ans(a) :- cnt(a, x, m), top(m)
    note: 'ORDER BY DESC(COUNT) LIMIT 1 is the (actor, decade) count equal to the maximum (ties all kept).
      SUBSTR is not a builtin: the decade is a fact decade(x) for x in 180..202 (1800s-2020s) whose digits
      prefix the release date.'
  3:
    datalog: |-
      pa(p, w) :- dbo:Actor(p), dbo:award(p, w)
      pa(p, w) :- dbo:MusicalArtist(p), dbo:award(p, w)
      cnt(p, n) :- AGGREGATE[p](pa(p, w) @ count(w)) = n
      top(m) :- AGGREGATE[](cnt(p, n) @ max(n)) = m
      ans(p) :- cnt(p, m), top(m)
    note: ORDER BY DESC(COUNT(DISTINCT ?award)) LIMIT 1 is the count equal to the maximum (ties all kept).
  4:
    datalog: |-
      art(a) :- dbo:MusicalArtist(a)
      art(a) :- dbo:Band(a)
      aa(a, b) :- art(a), dbo:artist(b, a)
      cnt(a, n) :- AGGREGATE[a](aa(a, b) @ count(b)) = n
      hist(n, k) :- AGGREGATE[n](cnt(a, n) @ count(a)) = k
      above(n, n2, k2) :- hist(n, k), hist(n2, k2), (n2 > n)
      rank(n, r) :- AGGREGATE[n](above(n, n2, k2) @ sum(k2)) = r
      ranked(n) :- rank(n, r)
      topn(n) :- rank(n, r), (r < 5)
      topn(n) :- hist(n, k), ~ranked(n)
      ans(a) :- cnt(a, n), topn(n)
    note: ORDER BY DESC(COUNT) LIMIT 5 keeps the artists whose album count is beaten by fewer than 5 artists
      (ties all kept); ranked through a histogram of counts, as pairs of the ~30k artists time out.
  5:
    datalog: |-
      sk(s, k) :- dbo:Species(s), dbo:conservationStatus(s, z), dbo:kingdom(s, k), regex(str(z), '(?i)Endangered|Critically endangered')
      cnt(k, n) :- AGGREGATE[k](sk(s, k) @ count(s)) = n
      hist(n, c) :- AGGREGATE[n](cnt(k, n) @ count(k)) = c
      above(n, n2, c2) :- hist(n, c), hist(n2, c2), (n2 > n)
      rank(n, r) :- AGGREGATE[n](above(n, n2, c2) @ sum(c2)) = r
      ranked(n) :- rank(n, r)
      topn(n) :- rank(n, r), (r < 3)
      topn(n) :- hist(n, c), ~ranked(n)
      ans(k) :- cnt(k, n), topn(n)
    note: ORDER BY DESC(COUNT) LIMIT 3 keeps the kingdoms beaten by fewer than 3 (ties kept).
  6:
    datalog: ans() :- dbp:trainer(<http://dbpedia.org/resource/Sasha_Banks>, <http://dbpedia.org/resource/Booker_T_(wrestler)>)
  7:
    datalog: ans() :- dbo:routeJunction(<http://dbpedia.org/resource/New_York_State_Route_470>, <http://dbpedia.org/resource/Watervliet,_New_York>)
  8:
    datalog: ans() :- dbp:discoverer(<http://dbpedia.org/resource/Pluto>, <http://dbpedia.org/resource/Clyde_Tombaugh>)
  9:
    datalog: ans() :- dbp:author(<http://dbpedia.org/resource/American_Psycho>, <http://dbpedia.org/resource/Bret_Easton_Ellis>)
  10:
    datalog: ans() :- dbo:license(<http://dbpedia.org/resource/Blender_(software)>, <http://dbpedia.org/resource/GNU_General_Public_License>)
  11:
    datalog: |-
      pm(u) :- yago:PrimeMinistersOfTheUnitedKingdom(u)
      pm(u) :- dbo:PrimeMinister(u), dbp:title(u, <http://dbpedia.org/resource/Prime_Minister_of_the_United_Kingdom>)
      ans(u) :- pm(u)
  12:
    datalog: |-
      w(u, d) :- dbp:author(u, <http://dbpedia.org/resource/Mark_Twain>), dbp:releaseDate(u, d)
      before(u, d, u2, d2) :- w(u, d), w(u2, d2), (d2 < d)
      rank(u, d, r) :- AGGREGATE[u, d](before(u, d, u2, d2) @ count(u2)) = r
      ranked(u, d) :- rank(u, d, r)
      top(u) :- rank(u, d, r), (r < 10)
      top(u) :- w(u, d), ~ranked(u, d)
      ans(u) :- top(u)
    note: ORDER BY ASC(?date) LIMIT 10 keeps the (work, date) rows with fewer than 10 strictly earlier
      dates (ties kept). Dates are strings as on the endpoint ('--12-10' of Huckleberry Finn sorts first),
      so the 10 rows give 9 works.
