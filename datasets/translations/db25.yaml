# Datalog translations of the gold SPARQL queries of TEXT2SPARQL db25,
# by question id. Each is checked against the official result set by
# `t2q-bench --dataset datasets/db25.yaml check-gold`. A question without
# a faithful translation has `datalog: null` and a `note` telling why.
#
# Conventions: predicates are named by prefix (dbo:name, dbp:name, rdfs:label);
# an instance of a class C is C(x) (DBpedia types are materialised, no
# subclass reasoning); IRIs are <...>; literals carry no language tag.
translations:
  1:
    datalog: |-
      sf(x, a) :- dbo:literaryGenre(x, <http://dbpedia.org/resource/Science_fiction>), dbo:author(x, a)
      n(c) :- AGGREGATE[](sf(x, a) @ count(a)) = c
      ans(c) :- n(c)
    note: >-
      COUNT(?author) without DISTINCT counts the (novel, author) solutions, so the
      count is over the pairs.
  2:
    datalog: |-
      pop(c, p) :- dbo:Country(c), dbo:populationTotal(c, p)
      beaten_by(c, c2) :- pop(c, p), pop(c2, p2), (p2 > p)
      n_beaten(c, j) :- AGGREGATE[c](beaten_by(c, c2) @ count(c2)) = j
      beaten(c) :- beaten_by(c, c2)
      top(c) :- n_beaten(c, j), (j < 10)
      top(c) :- pop(c, p), ~beaten(c)
      ans(c) :- top(c)
    note: >-
      ORDER BY DESC ... LIMIT 10 as "fewer than 10 countries with a larger
      population" (ties at the boundary all kept).
