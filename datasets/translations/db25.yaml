    datalog: |-
      films(d, k) :- AGGREGATE[d](dbo:director(f, d) @ count(f)) = k
      n_with(k, m) :- AGGREGATE[k](films(d, k) @ count(d)) = m
      above(k, k2, m2) :- n_with(k, m), n_with(k2, m2), (k2 > k)
      n_above(k, j) :- AGGREGATE[k](above(k, k2, m2) @ sum(m2)) = j
      beaten(k) :- above(k, k2, m2)
      top(d) :- films(d, k), n_above(k, j), (j < 10)
      top(d) :- films(d, k), ~beaten(k)
      ans(d) :- top(d)
    note: >-
      ORDER BY DESC(COUNT(?film)) LIMIT 10 as "fewer than 10 directors with more
      films" (ties at the boundary all kept). The rank of a film count is the sum
      of the numbers of directors with each larger count, which avoids a quadratic
      join over all directors.
