        amygdala(s) :- tian_activated('lAMY lh', s)
        amygdala(s) :- tian_activated('mAMY lh', s)
        active(s) :- amygdala(s), selected_study(s)
        close(q, s) :- similar_study(q, s), selected_study(s)
        p_active_given_close(q, PROB) :- active(s) // close(q, s)
        ans(p) :- cogat_definition('choice', d), p_active_given_close(d, p)

  - id: p-041
    tags: [cogat_term]
    split: test
    question:
      en: Which studies about efficiency report an activation within 5 mm of MNI (40, -50, 44)?
    gold:
      datalog: |-
        near(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, 40.0, -50.0, 44.0) <= 5)
        ans(s) :- cogat_definition('efficiency', d), similar_study(d, s), near(s)

  - id: p-049
    tags: [cogat_hierarchy]
    split: dev
    question:
      en: Which voxels are activated by studies mentioning a subclass of utility?
    gold:
      datalog: |-
        sub(t) :- cogat_term(c, 'utility'), cogat_subclass_of(x, c), cogat_term(x, t)
        term_study(s) :- sub(t), mentions(s, t), selected_study(s)
        activation(i, j, k, s) :- activated(i, j, k, s), selected_study(s)
        ans(i, j, k, p) :- PROB[activation(i, j, k, s) // term_study(s)] = p

  - id: p-058
    tags: [schaefer]
    split: test
    question:
      en: Is the left somatomotor network activated by studies about premotor?
    gold:
