dataset: https://neurolang.github.io/text2query/2026/neurosynth-v3-heldout/
engine: neurosynth
description: >
  Held-out questions on NeuroLang's neurosynth engine, in English, with
  hand-checked gold Datalog: the 25 questions of
  neurosynth-distill-heldout (Sonnet 5.5 answers accepted by an Opus
  judge, each read against the question and corrected where needed) and
  40 generated questions of the distillation pool that no model
  answered (scripts/distill.py), written by hand following the engine's
  assistant_guidance. None is in the example bank.

# Conventions of the gold queries (see runs/nsv3.md):
# - a probability question (activations, co-activations or co-occurring
#   terms of a term, topic or region: one probability per region, voxel
#   or term) is answered with PROB over selected_study, as the guidance
#   asks;
# - a list ("which studies") returns the entities themselves, without
#   PROB; a count uses AGGREGATE;
# - an argmax question ("which ... the most") keeps only the winner;
# - a free-text topic is the question's own words in similar_study.
#
# Tags: the category of the distillation pool. split: dev (to tune on)
# or test (held out), balanced across the tags
# (scripts/assign_splits.py).

questions:
  - id: dh-005
    tags: [free_text]
    split: dev
    question:
      en: Which subcortical regions are activated by studies about getting chills from music?
    gold:
      datalog: |-
        active(l, s) :- tian_activated(l, s), selected_study(s)
        close(q, s) :- similar_study(q, s), selected_study(s)
        ans(l, p) :- PROB[active(l, s) // close('getting chills from music', s)] = p

  - id: dh-010
    tags: [free_text]
    split: test
    question:
      en: Which voxels are activated by studies about being socially excluded in a ball-tossing game?
    gold:
      datalog: |-
        activation(i, j, k, s) :- activated(i, j, k, s), selected_study(s)
        close(q, s) :- similar_study(q, s), selected_study(s)
        ans(i, j, k, p) :- PROB[activation(i, j, k, s) // close('being socially excluded in a ball-tossing game', s)] = p

  - id: dh-015
    tags: [free_text]
    split: dev
    question:
      en: Which brain areas respond in studies about imagining future events?
    gold:
      datalog: |-
        active(l, s) :- destrieux_activated(l, s), selected_study(s)
        close(q, s) :- similar_study(q, s), selected_study(s)
        ans(l, p) :- PROB[active(l, s) // close('imagining future events', s)] = p

  - id: dh-020
    tags: [free_text]
    split: test
    note: question reworded from "judging other people's intentions" (a quote cannot be in a string) to the text of the gold
    question:
      en: Which cortical networks are activated by studies on judging the intentions of other people?
    gold:
      datalog: |-
        close(q, s) :- similar_study(q, s), selected_study(s)
        active(l, s) :- schaefer_activated(l, s), selected_study(s)
        ans(l, p) :- PROB[active(l, s) // close('judging the intentions of other people', s)] = p

  - id: dh-029
    tags: [cogat_term]
    split: dev
    question:
      en: Which voxels are activated by studies that mention verbal fluency?
    gold:
      datalog: |-
        activation(i, j, k, s) :- activated(i, j, k, s), selected_study(s)
        term_association(s, t) :- mentions(s, t), selected_study(s)
        ans(i, j, k, p) :- PROB[activation(i, j, k, s) // term_association(s, 'verbal fluency')] = p

  - id: dh-034
    tags: [cogat_term]
    split: test
    question:
      en: Which terms co-occur with movement in a study?
    gold:
      datalog: |-
        term_association(s, t) :- mentions(s, t), selected_study(s)
        ans(t, p) :- PROB[term_association(s, t) // term_association(s, 'movement')] = p

  - id: dh-039
    tags: [cogat_term]
    split: dev
    question:
      en: What is the probability that a study mentions listening, given that it activates the left hippocampus?
    gold:
      datalog: |-
        hip(s) :- tian_activated('aHIP lh', s)
        hip(s) :- tian_activated('pHIP lh', s)
        active(s) :- hip(s), selected_study(s)
        ment(s) :- mentions(s, 'listening'), selected_study(s)
        ans(p) :- PROB[ment(s) // active(s)] = p

  - id: dh-052
    tags: [cogat_hierarchy]
    split: test
    note: the class by cogat_term rather than its IRI; only the winning term is scored
    question:
      en: Which subclass of fixation is mentioned by the most studies?
    gold:
      datalog: |-
        sub(t) :- cogat_term(c, 'fixation'), cogat_subclass_of(x, c), cogat_term(x, t)
        ms(t, s) :- sub(t), mentions(s, t)
        cnt(t, n) :- AGGREGATE[t](ms(t, s) @ count(s)) = n
        top(m) :- AGGREGATE[](cnt(t, n) @ max(n)) = m
        ans(t) :- cnt(t, n), top(n)

  - id: dh-057
    tags: [schaefer]
    split: dev
    note: study column only (the probability of each study is 1/N)
    question:
      en: Which studies mention parietal lobe and activate the dorsal attention network?
    gold:
      datalog: |-
        dorsal_label(l) :- schaefer(l, r), startswith('17Networks LH DorsAttn', l)
        dorsal_label(l) :- schaefer(l, r), startswith('17Networks RH DorsAttn', l)
        dorsal(s) :- dorsal_label(l), schaefer_activated(l, s)
        ans(s) :- mentions(s, 'parietal lobe'), dorsal(s)

  - id: dh-062
    tags: [schaefer]
    split: test
    note: study column only (the probability of each study is 1/N)
    question:
      en: Which studies activate the somatomotor network but not the peripheral visual network?
    gold:
      datalog: |-
        som_label(l) :- schaefer(l, r), startswith('17Networks LH SomMot', l)
        som_label(l) :- schaefer(l, r), startswith('17Networks RH SomMot', l)
        vis_label(l) :- schaefer(l, r), startswith('17Networks LH VisPeri', l)
        vis_label(l) :- schaefer(l, r), startswith('17Networks RH VisPeri', l)
        som(s) :- som_label(l), schaefer_activated(l, s)
        vis(s) :- vis_label(l), schaefer_activated(l, s)
        ans(s) :- som(s), ~vis(s)

  - id: dh-067
    tags: [schaefer]
    split: dev
    note: networks named as in the guidance (VisCent and VisPeri apart, not one 'Vis'); only the winning network is scored
    question:
      en: Which network is most often activated by studies that mention imagery?
    gold:
      datalog: |-
        lab(l, 'VisCent') :- schaefer(l, r), startswith('17Networks LH VisCent', l)
        lab(l, 'VisCent') :- schaefer(l, r), startswith('17Networks RH VisCent', l)
        lab(l, 'VisPeri') :- schaefer(l, r), startswith('17Networks LH VisPeri', l)
        lab(l, 'VisPeri') :- schaefer(l, r), startswith('17Networks RH VisPeri', l)
        lab(l, 'SomMot') :- schaefer(l, r), startswith('17Networks LH SomMot', l)
        lab(l, 'SomMot') :- schaefer(l, r), startswith('17Networks RH SomMot', l)
        lab(l, 'DorsAttn') :- schaefer(l, r), startswith('17Networks LH DorsAttn', l)
        lab(l, 'DorsAttn') :- schaefer(l, r), startswith('17Networks RH DorsAttn', l)
        lab(l, 'SalVentAttn') :- schaefer(l, r), startswith('17Networks LH SalVentAttn', l)
        lab(l, 'SalVentAttn') :- schaefer(l, r), startswith('17Networks RH SalVentAttn', l)
        lab(l, 'Limbic') :- schaefer(l, r), startswith('17Networks LH Limbic', l)
        lab(l, 'Limbic') :- schaefer(l, r), startswith('17Networks RH Limbic', l)
        lab(l, 'Cont') :- schaefer(l, r), startswith('17Networks LH Cont', l)
        lab(l, 'Cont') :- schaefer(l, r), startswith('17Networks RH Cont', l)
        lab(l, 'Default') :- schaefer(l, r), startswith('17Networks LH Default', l)
        lab(l, 'Default') :- schaefer(l, r), startswith('17Networks RH Default', l)
        lab(l, 'TempPar') :- schaefer(l, r), startswith('17Networks LH TempPar', l)
        lab(l, 'TempPar') :- schaefer(l, r), startswith('17Networks RH TempPar', l)
        active(n, s) :- schaefer_activated(l, s), lab(l, n), selected_study(s)
        term_association(s) :- mentions(s, 'imagery'), selected_study(s)
        p_n(n, p) :- PROB[active(n, s) // term_association(s)] = p
        top(m) :- AGGREGATE[](p_n(n, p) @ max(p)) = m
        ans(n) :- p_n(n, p), top(p)

  - id: dh-072
    tags: [schaefer]
    split: test
    question:
      en: Which parcels belong to the temporoparietal network in the right hemisphere?
    gold:
      datalog: |-
        ans(l) :- schaefer(l, r), startswith('17Networks RH TempPar', l)

  - id: dh-077
    tags: [destrieux]
    split: dev
    question:
      en: Which terms co-occur with an activation of right postcentral gyrus?
    gold:
      datalog: |-
        active(s) :- destrieux_activated('R G postcentral', s), selected_study(s)
        term_study(s, t) :- mentions(s, t), selected_study(s)
        ans(t, p) :- PROB[term_study(s, t) // active(s)] = p

  - id: dh-087
    tags: [destrieux]
    split: test
    note: study column only (the probability of each study is 1/N)
    question:
      en: Which studies activate right subparietal sulcus and mention superior temporal?
    gold:
      datalog: |-
        ans(s) :- destrieux_activated('R S subparietal', s), mentions(s, 'superior temporal')

  - id: dh-093
    tags: [tian]
    split: dev
    question:
      en: Which Tian atlas regions are activated by studies that mention vision?
    gold:
      datalog: |-
        active(l, s) :- tian_activated(l, s), selected_study(s)
        term_association(s, t) :- mentions(s, t), selected_study(s)
        ans(l, p) :- PROB[active(l, s) // term_association(s, 'vision')] = p

  - id: dh-107
    tags: [prob_forward]
    split: test
    question:
      en: Given behavioural, how probable is sensorimotor in a study?
    gold:
      datalog: |-
        ta(s, t) :- mentions(s, t), selected_study(s)
        ans(p) :- PROB[ta(s, 'sensorimotor') // ta(s, 'behavioural')] = p

  - id: dh-112
    tags: [prob_forward]
    split: dev
    question:
      en: What is the probability that a study activates the MNI point left motor hand area (MNI -38, -22, 56)?
    gold:
      datalog: |-
        near(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, -38.0, -22.0, 56.0) <= 6)
        active(s) :- near(s), selected_study(s)
        ans(p) :- PROB[active(s)] = p

  - id: dh-117
    tags: [prob_forward]
    split: test
    question:
      en: What is the lift of the association between left hippocampus (MNI -28, -22, -14) and deficit?
    gold:
      datalog: |-
        near(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, -28.0, -22.0, -14.0) <= 6)
        active(s) :- near(s), selected_study(s)
        mentioned(s) :- mentions(s, 'deficit'), selected_study(s)
        both(s) :- near(s), mentions(s, 'deficit'), selected_study(s)
        pa(p) :- PROB[active(s)] = p
        pt(p) :- PROB[mentioned(s)] = p
        pat(p) :- PROB[both(s)] = p
        ans(l) :- pa(a), pt(t), pat(b), (l == b / (a * t))

  - id: dh-122
    tags: [prob_forward]
    split: dev
    question:
      en: How much does emotion regulation increase the chance of activating right fusiform face area (MNI 40, -52, -18)?
    gold:
      datalog: |-
        near(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, 40.0, -52.0, -18.0) <= 6)
        act(s) :- near(s), selected_study(s)
        close(q, s) :- similar_study(q, s), selected_study(s)
        p_act_given_close(q, PROB) :- act(s) // close(q, s)
        pr_a(p) :- PROB[act(s)] = p
        ans(lift) :- p_act_given_close('emotion regulation', pc), pr_a(pa), (lift == pc / pa)

  - id: dh-127
    tags: [coactivation]
    split: test
    question:
      en: Which subcortical structures co-activate with hippocampus in studies about injury?
    gold:
      datalog: |-
        active(l, s) :- tian_activated(l, s), selected_study(s)
        hip(s) :- tian_activated(l, s), startswith('aHIP', l), selected_study(s)
        hip(s) :- tian_activated(l, s), startswith('pHIP', l), selected_study(s)
        seed(s) :- hip(s), mentions(s, 'injury'), selected_study(s)
        ans(l, p) :- PROB[active(l, s) // seed(s)] = p

  - id: dh-132
    tags: [coactivation]
    split: dev
    question:
      en: Is frontoparietal control co-activated with salience ventral attention in studies that mention cognitive control?
    gold:
      datalog: |-
        cont_label(l) :- schaefer(l, r), startswith('17Networks LH Cont', l)
        cont_label(l) :- schaefer(l, r), startswith('17Networks RH Cont', l)
        sal_label(l) :- schaefer(l, r), startswith('17Networks LH SalVentAttn', l)
        sal_label(l) :- schaefer(l, r), startswith('17Networks RH SalVentAttn', l)
        cont(s) :- cont_label(l), schaefer_activated(l, s), selected_study(s)
        sal(s) :- sal_label(l), schaefer_activated(l, s), selected_study(s)
        both(s) :- cont(s), sal(s)
        cc(s) :- mentions(s, 'cognitive control'), selected_study(s)
        ans(p) :- PROB[both(s) // cc(s)] = p

  - id: dh-141
    tags: [counts]
    split: test
    question:
      en: How many studies mention young adults but not orbitofrontal?
    gold:
      datalog: |-
        sel(s) :- mentions(s, 'young adults'), ~mentions(s, 'orbitofrontal')
        ans(n) :- AGGREGATE[](sel(s) @ count(s)) = n

  - id: dh-151
    tags: [counts]
    split: dev
    question:
      en: How many studies that mention sound activate the left amygdala?
    gold:
      datalog: |-
        amygdala(s) :- tian_activated('lAMY lh', s)
        amygdala(s) :- tian_activated('mAMY lh', s)
        hit(s) :- amygdala(s), mentions(s, 'sound')
        ans(n) :- AGGREGATE[](hit(s) @ count(s)) = n

  - id: dh-166
    tags: [negation]
    split: test
    question:
      en: Which gyri and sulci are not activated by studies about adolescence?
    gold:
      datalog: |-
        not_active(l, s) :- destrieux(l, r), selected_study(s), ~destrieux_activated(l, s)
        term_association(s, t) :- mentions(s, t), selected_study(s)
        ans(l, p) :- PROB[not_active(l, s) // term_association(s, 'adolescence')] = p

  - id: dh-171
    tags: [conj_disj]
    split: dev
    question:
      en: What is the probability that a study mentions both working memory and ventromedial prefrontal?
    gold:
      datalog: |-
        both(s) :- mentions(s, 'working memory'), mentions(s, 'ventromedial prefrontal'), selected_study(s)
        ans(p) :- PROB[both(s)] = p

  # Questions of the distillation pool that no model answered: gold
  # written by hand.

  - id: p-008
    tags: [free_text]
    split: test
    question:
      en: Is the right insula activated by studies about disgust at rotten food?
    gold:
      datalog: |-
        insula_label(l) :- destrieux(l, r), startswith('R G Ins', l)
        insula_label(l) :- destrieux(l, r), startswith('R G insular', l)
        insula_label(l) :- destrieux(l, r), startswith('R S circular insula', l)
        insula(s) :- insula_label(l), destrieux_activated(l, s), selected_study(s)
        close(q, s) :- similar_study(q, s), selected_study(s)
        ans(p) :- PROB[insula(s) // close('disgust at rotten food', s)] = p

