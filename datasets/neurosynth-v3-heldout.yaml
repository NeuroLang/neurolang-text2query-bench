  - id: p-094
    tags: [tian]
    split: test
    question:
      en: What is the probability that a study activates nucleus accumbens, given that it mentions words?
    gold:
      datalog: |-
        nac_label(l) :- tian(l, r), startswith('NAc', l)
        nac(s) :- nac_label(l), tian_activated(l, s), selected_study(s)
        term_association(s, t) :- mentions(s, t), selected_study(s)
        ans(p) :- PROB[nac(s) // term_association(s, 'words')] = p

