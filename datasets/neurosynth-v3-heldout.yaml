        hit(s) :- destrieux_activated('L S orbital med olfact', s), mentions(s, 'sentences')
        ans(n) :- AGGREGATE[](hit(s) @ count(s)) = n

  - id: p-088
    tags: [destrieux]
    split: dev
    question:
      en: What is the probability that a study mentions extrastriate, given that it activates right angular gyrus?
    gold:
      datalog: |-
        angular(s) :- destrieux_activated('R G pariet inf Angular', s), selected_study(s)
