  - id: p-116
    tags: [prob_forward]
    split: dev
    question:
      en: What is the lift of premotor cortex given syntactic?
    gold:
      datalog: |-
        pc(s) :- mentions(s, 'premotor cortex'), selected_study(s)
        syn(s) :- mentions(s, 'syntactic'), selected_study(s)
        both(s) :- mentions(s, 'premotor cortex'), mentions(s, 'syntactic'), selected_study(s)
        p_pc(p) :- PROB[pc(s)] = p
        p_syn(p) :- PROB[syn(s)] = p
        p_both(p) :- PROB[both(s)] = p
        ans(lift) :- p_both(b), p_pc(a), p_syn(t), (lift == b / (a * t))

  - id: p-128
