  - id: p-035
    tags: [cogat_term]
    split: test
    question:
      en: Which studies mention both manipulation and sentence?
    gold:
      datalog: |-
        ans(s) :- mentions(s, 'manipulation'), mentions(s, 'sentence')

  - id: p-038
    tags: [cogat_term]
    split: dev
    question:
      en: Is the left amygdala activated by studies on choice?
    gold:
