dataset: https://neurolang.github.io/text2query/2026/neurosynth-distill-heldout/
engine: neurosynth
description: >
  Generated questions of scripts/distill.py kept out of the example bank. The gold is Sonnet 5.5's
  ReAct query, kept when it returned rows and the judge (Opus 5.5)
  accepted it.

questions:
- id: dh-005
  tags:
  - free_text
  split: heldout
  question:
    en: Which subcortical regions are activated by studies about getting chills from music?
  gold:
    datalog: 'active(l, s) :- tian_activated(l, s), selected_study(s)

      close(q, s) :- similar_study(q, s), selected_study(s)

      ans(l, p) :- PROB[active(l, s) // close(''getting chills from music'', s)] = p'
- id: dh-077
  tags:
  - destrieux
  split: heldout
  question:
    en: Which terms co-occur with an activation of right postcentral gyrus?
  gold:
    datalog: 'active(s) :- destrieux_activated(''R G postcentral'', s), selected_study(s)

      term_study(s, t) :- mentions(s, t), selected_study(s)

      ans(t, p) :- PROB[term_study(s, t) // active(s)] = p'
- id: dh-107
  tags:
  - prob_forward
  split: heldout
  question:
    en: Given behavioural, how probable is sensorimotor in a study?
  gold:
    datalog: 'ta(s, t) :- mentions(s, t), selected_study(s)

      ans(p) :- PROB[ta(s, ''sensorimotor'') // ta(s, ''behavioural'')] = p'
- id: dh-141
  tags:
  - counts
  split: heldout
  question:
    en: How many studies mention young adults but not orbitofrontal?
  gold:
    datalog: 'sel(s) :- mentions(s, ''young adults''), ~mentions(s, ''orbitofrontal'')

      ans(n) :- AGGREGATE[](sel(s) @ count(s)) = n'
- id: dh-171
  tags:
  - conj_disj
  split: heldout
  question:
    en: What is the probability that a study mentions both working memory and ventromedial prefrontal?
  gold:
    datalog: 'both(s) :- mentions(s, ''working memory''), mentions(s, ''ventromedial prefrontal''), selected_study(s)

      ans(p) :- PROB[both(s)] = p'
- id: dh-010
  tags:
  - free_text
  split: heldout
  question:
    en: Which voxels are activated by studies about being socially excluded in a ball-tossing game?
  gold:
    datalog: 'activation(i, j, k, s) :- activated(i, j, k, s), selected_study(s)

      close(q, s) :- similar_study(q, s), selected_study(s)

      ans(i, j, k, p) :- PROB[activation(i, j, k, s) // close(''being socially excluded in a ball-tossing
      game'', s)] = p'
- id: dh-052
  tags:
  - cogat_hierarchy
  split: heldout
  question:
    en: Which subclass of fixation is mentioned by the most studies?
  gold:
    datalog: 'sub(t) :- cogat_subclass_of(x, <http://www.cognitiveatlas.org/ontology/cogat.owl#CAO_00305>),
      cogat_term(x, t)

      ms(t, s) :- sub(t), mentions(s, t)

      cnt(t, n) :- AGGREGATE[t](ms(t, s) @ count(s)) = n

      top(m) :- AGGREGATE[](cnt(t, n) @ max(n)) = m

      ans(t, n) :- cnt(t, n), top(n)'
- id: dh-112
  tags:
  - prob_forward
  split: heldout
  question:
    en: What is the probability that a study activates the MNI point left motor hand area (MNI -38, -22,
      56)?
  gold:
    datalog: 'near(s) :- peak_mni(x, y, z, s), (euclidean(x, y, z, -38.0, -22.0, 56.0) <= 3)

      active(s) :- near(s), selected_study(s)

      ans(p) :- PROB[active(s)] = p'
